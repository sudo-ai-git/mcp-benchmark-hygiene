[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-benchmark-hygiene"
version = "1.0.1"
description = "MCP server detecting pytest config-leakage that corrupts agent-benchmark grading (deterministic, no-LLM)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["mcp>=1.0"]

[project.urls]
Repository = "https://github.com/sudo-ai-git/mcp-benchmark-hygiene"
Source = "https://github.com/sudo-ai-git/mcp-benchmark-hygiene"

[tool.setuptools]
py-modules = ["mcp_server"]
